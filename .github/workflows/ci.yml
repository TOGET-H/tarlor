name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/oracle-ci.db
      NUXT_SILICONFLOW_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate clients and Nuxt types
        run: |
          pnpm exec prisma generate
          pnpm exec nuxt prepare
      - name: Type check
        run: pnpm typecheck
      - name: AI gateway contract tests (no external requests)
        run: pnpm test:ai
      - name: Speech playback lifecycle tests
        run: pnpm test:speech
      - name: Build production server
        run: pnpm build
      - name: Smoke test with isolated SQLite database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          HOST=127.0.0.1 PORT=3100 node .output/server/index.mjs > /tmp/oracle-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ORACLE_TEST_URL=http://127.0.0.1:3100 node scripts/smoke.mjs
          node scripts/ai-runtime.mjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/oracle-ci.log 2>/dev/null || true
