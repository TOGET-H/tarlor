# This file is loaded inside nginx's http context.
limit_req_zone $binary_remote_addr zone=oracle_draw:10m rate=6r/m;
# Bound aggregate paid-model traffic, including requests from different IPs.
limit_req_zone $server_name zone=oracle_total:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=oracle_speech:10m rate=30r/m;
limit_req_zone $server_name zone=oracle_speech_total:1m rate=60r/m;
server {
    listen 80;
    server_name oracle.digitaloracle.asia 123.57.144.99;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/readings/draw {
        limit_except POST { deny all; }
        limit_req zone=oracle_draw burst=2 nodelay;
        limit_req zone=oracle_total burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location = /api/tts/synthesize {
        limit_except POST { deny all; }
        limit_req zone=oracle_speech burst=5 nodelay;
        limit_req zone=oracle_speech_total burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 70s;
    }

    # Legacy CRUD routes have no authentication. Expose read access only.
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
